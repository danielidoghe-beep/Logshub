<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TheSuftSocials</title>

    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">

    <!-- Remix Icons -->
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.6.0/fonts/remixicon.css" rel="stylesheet">
</head>
<body>

    <!-- Overlay -->
    <div id="overlay"></div>

    <!-- Sidebar -->
    <aside id="sidebar">

        <div class="sidebar-header">
            <h2>TheSuftSocials</h2>
            <button id="closeMenu">
                <i class="ri-close-line"></i>
            </button>
        </div>

        <nav>

            <a href="index.html">
                <i class="ri-home-5-line"></i>
                Home
            </a>

            <a href="#">
                <i class="ri-apps-line"></i>
                Categories
            </a>

            <a href="#">
                <i class="ri-customer-service-2-line"></i>
                Support
            </a>

            <hr>

            <!-- Hidden when logged in -->
            <div id="guestMenu">

                <a href="pages/login.html">
                    <i class="ri-login-box-line"></i>
                    Login
                </a>

                <a href="pages/register.html">
                    <i class="ri-user-add-line"></i>
                    Register
                </a>

            </div>

            <!-- Hidden when logged out -->
            <div id="userMenu">

                <a href="pages/profile.html">
                    <i class="ri-user-line"></i>
                    Profile
                </a>

                <a href="pages/orders.html">
                    <i class="ri-shopping-bag-line"></i>
                    Orders
                </a>

                <a href="pages/wallet.html">
                    <i class="ri-wallet-3-line"></i>
                    Wallet
                </a>

                <a href="#">
                    <i class="ri-notification-3-line"></i>
                    Notifications
                </a>

                <a href="#">
                    <i class="ri-logout-box-line"></i>
                    Logout
                </a>

            </div>

            <hr>

            <a href="#">
                <i class="ri-information-line"></i>
                About Us
            </a>

            <a href="#">
                <i class="ri-shield-check-line"></i>
                Privacy Policy
            </a>

            <a href="#">
                <i class="ri-file-list-3-line"></i>
                Terms
            </a>

        </nav>

    </aside>

    <!-- Header -->
    <header>

        <button id="menuBtn">
            <i class="ri-menu-line"></i>
        </button>

        <div class="logo">
            TheSuftSocials
        </div>

        <div class="header-icons">

            <button>
                <i class="ri-search-line"></i>
            </button>

            <button>
                <i class="ri-sun-line"></i>
            </button>

            <button>
                <i class="ri-shopping-cart-2-line"></i>
            </button>

        </div>

    </header>

    <!-- Hero Section -->
    <section class="hero">

        <div class="hero-content">

            <h1>
                Buy Premium Digital Products
            </h1>

            <p>
                Social Media Accounts, SMS Numbers, Premium Logins, Boosting Services and more.
            </p>

            <div class="hero-buttons">

                <button class="primary-btn">
                    Shop Now
                </button>

                <button class="secondary-btn">
                    Browse Categories
                </button>

            </div>

        </div>

    </section>

    <!-- Categories -->
    <section id="categories">

    </section>

    <!-- Featured Products -->
    <section id="featuredProducts">

    </section>

    <!-- Latest Products -->
    <section id="latestProducts">

    </section>

    <!-- Why Choose Us -->
    <section id="whyChooseUs">

    </section>

    <!-- Reviews -->
    <section id="reviews">

    </section>

    <!-- FAQ -->
    <section id="faq">

    </section>

    <!-- Footer -->
    <footer>

    </footer>

    <script type="module" src="js/index.js"></script>

</body>
</html>
